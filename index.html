<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navoryn | Design, Development & Intelligent Technology</title>
    <meta
      name="description"
      content="Navoryn is an independent digital studio building high-performance websites, web apps, mobile apps and custom dashboards for ambitious businesses."
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="robots" content="index, follow" />
    <meta name="application-name" content="Navoryn" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Navoryn" />
    <meta property="og:title" content="Navoryn | Design, Development & Intelligent Technology" />
    <meta
      property="og:description"
      content="An independent digital studio turning ambitious ideas into meaningful digital experiences."
    />
    <meta name="twitter:card" content="summary" />
    <link rel="preload" as="image" href="/preloader/sticker-1.webp" type="image/webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap"
      />
    </noscript>
    <link rel="icon" type="image/svg+xml" id="favicon" href="/favicon-dark.svg" />
    <script>
      function updateFavicon() {
        const favicon = document.getElementById('favicon')
        if (!favicon) return
        const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        favicon.href = isDark ? '/favicon-light.svg' : '/favicon-dark.svg'
      }

      updateFavicon()
      window.matchMedia('(prefers-color-scheme: dark)')
        .addEventListener('change', updateFavicon)

      const defaultTitle = 'Navoryn'
      const awayTitle    = 'Miss you 👋 | Navoryn'

      document.addEventListener('visibilitychange', () => {
        document.title = document.hidden ? awayTitle : defaultTitle
      })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
